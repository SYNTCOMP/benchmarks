name: Check selection manifests

on: [push, pull_request]

jobs:
  check-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 selection/checkSelection.py
      - run: python3 -m pip install pandas
      - run: python3 -m unittest discover -s selection -p 'test_*.py'
